<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- WinXPRemix — "Hill" (day). Original artwork inspired by the classic landscape. -->
  <!-- SPDX-FileCopyrightText: 2026 pdrmottadev -->
  <!-- SPDX-License-Identifier: CC-BY-4.0 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4fd6"/>
      <stop offset="0.45" stop-color="#3a8bf2"/>
      <stop offset="1" stop-color="#a9d4ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#fff6d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc95a"/>
      <stop offset="1" stop-color="#3f8f2b"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#8fdc4f"/>
      <stop offset="0.35" stop-color="#5cb832"/>
      <stop offset="1" stop-color="#2a7a1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#eaffb8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#sun)"/>

  <!-- nuvens -->
  <g fill="#ffffff" filter="url(#soft)" opacity="0.85">
    <ellipse cx="620" cy="430" rx="420" ry="90"/>
    <ellipse cx="860" cy="380" rx="300" ry="110"/>
    <ellipse cx="1040" cy="450" rx="360" ry="80"/>
    <ellipse cx="2350" cy="300" rx="380" ry="70"/>
    <ellipse cx="2560" cy="260" rx="260" ry="95"/>
    <ellipse cx="3380" cy="620" rx="330" ry="70"/>
    <ellipse cx="1650" cy="760" rx="520" ry="60"/>
  </g>
  <g fill="#ffffff" filter="url(#softer)" opacity="0.55">
    <ellipse cx="300" cy="900" rx="700" ry="120"/>
    <ellipse cx="3100" cy="980" rx="900" ry="140"/>
  </g>

  <!-- colina distante -->
  <path d="M0 1500 C 700 1310, 1400 1290, 2100 1400 S 3300 1330, 3840 1250 L 3840 2160 L 0 2160 Z"
        fill="url(#hillBack)" opacity="0.9"/>

  <!-- colina principal -->
  <path d="M0 1640 C 900 1180, 2200 1180, 3840 1560 L 3840 2160 L 0 2160 Z" fill="url(#hill)"/>
  <path d="M0 1640 C 900 1180, 2200 1180, 3840 1560 L 3840 1700 C 2300 1370, 1000 1360, 0 1800 Z"
        fill="url(#sheen)" filter="url(#soft)"/>

  <!-- linhas sutis de relevo (toque moderno) -->
  <g fill="none" stroke="#d9ffb0" stroke-opacity="0.18" stroke-width="6">
    <path d="M0 1820 C 1000 1440, 2300 1450, 3840 1760"/>
    <path d="M0 1990 C 1100 1640, 2400 1650, 3840 1950"/>
  </g>
</svg>
